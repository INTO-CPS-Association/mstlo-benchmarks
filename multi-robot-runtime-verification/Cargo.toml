[package]
name = "robot_brownian_sim"
version = "0.1.0"
edition = "2024"
description = "Brownian-motion robot simulation with ROS 2 distributed monitoring"
license-file = "LICENSE.md"
readme = "README.md"
publish = false

[dependencies]
bevy = "0.19.0"
clap = { version = "4.6.1", features = ["derive"] }
futures = "0.3.32"
r2r = "0.9.5"
rand = "0.10.1"
rand_chacha = "0.10.0"
rand_distr = "0.6.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "time", "sync"] }
