[project]
name = "robot-brownian-sim-benchmarks"
version = "0.1.0"
description = "Scalability benchmark harness for robot_brownian_sim"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.10.0",
    "pandas>=2.2.0",
    "polars>=1.31.0",
    "pyarrow>=17.0.0",
    "tqdm>=4.67.0",
]

[project.scripts]
benchmark-scalability = "scripts.benchmark_scalability:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]
