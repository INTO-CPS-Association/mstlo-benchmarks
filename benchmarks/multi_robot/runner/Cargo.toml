[package]
name = "mstlo-benchmark-runner"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
ros = ["dep:r2r"]

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
futures = "0.3.32"

# The vendored subtree, not the published crate: the number this benchmark
# reports has to come from the same source the other two measure.
mstlo = { path = "../../../mstlo/mstlo" }
r2r = { version = "0.9.5", optional = true }
rand = "0.10.1"
rand_chacha = "0.10.0"
rand_distr = "0.6.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
smol = "2.0.2"
tikv-jemallocator = "0.6.1"
trustworthiness_checker = { path = "../../../robosapiens-trustworthiness-checker", default-features = false }

# trustworthiness_checker asks crates.io for mstlo.  Without this it would get a
# second, different copy of the crate under test, linked into the same binary as
# the one above.  The checker binary is built on its own -- see
# docker/cargo-config.toml, which patches it the same way.
[patch.crates-io]
mstlo = { path = "../../../mstlo/mstlo" }

[profile.bench-fast]
inherits = "release"
lto = false
codegen-units = 16
