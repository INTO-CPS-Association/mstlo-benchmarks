# Proves the pipeline works.  Says nothing about performance.
#
# Small signal, two runs, and a sweep of six bounds rather than 51 -- every part
# of the run stage is exercised, none of it for long.

[run]
SIGNAL_SIZE = 2000
SIGNAL_TYPES = "chirp"
M_RUNS = 2
WARMUP_RUNS = 0

BOUND_LOW = 0
BOUND_HIGH = 500
BOUND_STEP = 100

[analyze]
