[project]
name = "mstlo-benchmarks"
version = "0.1.0"
description = "Reference latency benchmark for MSTLO"
requires-python = ">=3.11"
dependencies = ["matplotlib>=3.10.0", "tqdm>=4.67.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
mstlo-bench = "mstlo_bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["benchmarks/multi_robot/mstlo_bench"]

[tool.pytest.ini_options]
testpaths = ["benchmarks/tests", "benchmarks/multi_robot/tests"]
